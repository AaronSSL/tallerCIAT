<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agregar Taller - Gestor de Talleres</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Gestor de Talleres</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="agregar-taller.html">Agregar Taller</a>
          </li>
        </ul>
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="#" id="cerrar-sesion">
              <i class="bi bi-box-arrow-right me-1"></i>Cerrar Sesión
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card">
          <div class="card-header">
            <h5 class="mb-0">Agregar Nuevo Taller</h5>
          </div>
          <div class="card-body">
            <form id="nuevo-taller-form">
              <div class="mb-3">
                <label for="titulo" class="form-label">Título del Taller</label>
                <input type="text" class="form-control" id="titulo" required>
              </div>
              
              <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea class="form-control" id="descripcion" rows="3" required></textarea>
              </div>
              
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="encargado" class="form-label">Nombre del Encargado</label>
                  <input type="text" class="form-control" id="encargado" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="correo_encargado" class="form-label">Correo del Encargado</label>
                  <input type="email" class="form-control" id="correo_encargado" required>
                </div>
              </div>
              
              <div class="row">
                <div class="col-md-4 mb-3">
                  <label for="fecha" class="form-label">Fecha</label>
                  <input type="date" class="form-control" id="fecha" required>
                </div>
                <div class="col-md-4 mb-3">
                  <label for="hora_inicio" class="form-label">Hora de Inicio</label>
                  <input type="time" class="form-control" id="hora_inicio" required>
                </div>
                <div class="col-md-4 mb-3">
                  <label for="horario_fin" class="form-label">Hora de Finalización</label>
                  <input type="time" class="form-control" id="horario_fin" required>
                </div>
              </div>
              
              <div class="d-flex justify-content-end gap-2">
                <a href="index.html" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">Guardar Taller</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/agregar-taller.js"></script>
</body>
</html>
