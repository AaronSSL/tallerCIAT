<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    // Redirigir solo si NO hay acceso en localStorage NI en sessionStorage
    if (
        localStorage.getItem("accesoPermitido") !== "true" ||
        sessionStorage.getItem("sesionActiva") !== "true"
    ) {
        window.location.replace("login.html");
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Gestor de Talleres</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Gestor de Talleres</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" href="index.html">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="agregar-taller.html">Agregar Taller</a>
          </li>
        </ul>
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="#" id="cerrar-sesion">
              <i class="bi bi-box-arrow-right me-1"></i>Cerrar Sesión
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>Dashboard de Talleres</h1>
      <a href="agregar-taller.html" class="btn btn-primary">
        <i class="bi bi-plus-circle me-2"></i>Nuevo Taller
      </a>
    </div>

    <div class="card mb-4">
      <div class="card-header">
        <div class="d-flex justify-content-between align-items-center">
          <h5 class="mb-0">Lista de Talleres</h5>
          <input type="text" class="form-control form-control-sm w-auto" id="buscar-taller" placeholder="Buscar taller...">
        </div>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-striped table-hover">
            <thead>
              <tr>
                <!-- Eliminada la columna ID -->
                <th>Título</th>
                <th>Descripción</th>
                <th>Encargado</th>
                <th>Fecha</th>
                <th>Horario</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="talleres-tabla">
              <tr>
                <td colspan="6" class="text-center">Cargando talleres...</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-3">
          <div>
            <span id="total-registros">0</span> talleres encontrados
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Editar Taller (antes era Ver Detalles) -->
  <div class="modal fade" id="editarTallerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Editar Taller</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="editar-taller-form">
            <input type="hidden" id="editar-id">
            <div class="row">
              <div class="col-md-12 mb-3">
                <label for="editar-titulo" class="form-label">Título:</label>
                <input type="text" class="form-control" id="editar-titulo" required>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="editar-encargado" class="form-label">Encargado:</label>
                <input type="text" class="form-control" id="editar-encargado" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="editar-correo" class="form-label">Correo del Encargado:</label>
                <input type="email" class="form-control" id="editar-correo" required>
              </div>
            </div>
            <div class="row">
              <div class="col-md-4 mb-3">
                <label for="editar-fecha" class="form-label">Fecha:</label>
                <input type="date" class="form-control" id="editar-fecha" required>
              </div>
              <div class="col-md-4 mb-3">
                <label for="editar-hora-inicio" class="form-label">Hora Inicio:</label>
                <input type="time" class="form-control" id="editar-hora-inicio" required>
              </div>
              <div class="col-md-4 mb-3">
                <label for="editar-hora-fin" class="form-label">Hora Fin:</label>
                <input type="time" class="form-control" id="editar-hora-fin" required>
              </div>
            </div>
            <div class="row">
              <div class="col-12 mb-3">
                <label for="editar-descripcion" class="form-label">Descripción:</label>
                <textarea class="form-control" id="editar-descripcion" rows="3" required></textarea>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="guardar-cambios">Guardar Cambios</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
